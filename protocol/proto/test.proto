syntax = "proto3";
package pb;
option go_package = "vcluster-system/protocol/pb";
service TestDelayService {
  // 查询任务
rpc TestDelay(TestDelayRequest) returns (TestDelayResponse);
}


message TestDelayRequest {
  string task_id = 1;
  uint32 query_id = 2;
  repeated float query = 3;
  string task_type = 4;
  int64 top_k = 5;
  float goal = 6; // recall goal, may need to set default value
}


message TestDelayResponse {
    bool success = 1;
    string message = 2;
}

