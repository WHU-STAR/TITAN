
syntax = "proto3";

import "google/protobuf/empty.proto";

package pb;

option go_package = "github.com/WHU-STAR/TITAN/protocol/pb";

service ClientService {
  // Receive a finished query.
  rpc QueryTask(ClientTaskRequest) returns (google.protobuf.Empty);
}

message ClientTaskRequest {
  uint32 query_id = 1;
  repeated uint32 result = 2;
  string task_id = 3;
}
